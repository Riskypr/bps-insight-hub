services:
  # CATATAN PENTING: service "qdrant" dan "ollama" SENGAJA TIDAK didefinisikan
  # di sini. Container qdrant & ollama SUDAH jalan mandiri di luar compose ini
  # (dicek lewat `docker ps`: container "qdrant" & "ollama", running >7 hari),
  # dan SUDAH BERISI 981 dokumen publikasi produksi.
  #
  # Kalau compose ini ikut mendefinisikan service "qdrant"/"ollama" sendiri,
  # itu akan membuat container BARU YANG TERPISAH (volume named "qdrant_data"
  # yang KOSONG) -- BUKAN container lama yang sudah ada datanya. Bahaya
  # kebingungan besar ("data hilang") padahal cuma nyambung ke instance salah.
  #
  # Jadi: container qdrant/ollama yang sudah ada itu TETAP dikelola terpisah
  # (docker run manual / compose lain, di luar file ini) -- TIDAK disentuh
  # sama sekali oleh file ini. Service "app" di bawah cukup menjangkaunya
  # lewat host.docker.internal (Docker Desktop Windows/Mac menyediakan DNS
  # ini utk container menjangkau balik port yang di-publish host), karena
  # container qdrant/ollama itu publish port ke host (6333, 11434).
  #
  # CARA MENGUBAH SETELAN (tanpa menyentuh file ini atau kode):
  #   1) salin .env.example -> .env di folder yang sama dengan file ini,
  #   2) isi/ubah nilainya,
  #   3) terapkan: `docker compose up -d app`   (BUKAN `restart`).
  # `environment:` di bawah HANYA meneruskan variabel yang tertulis di sini.
  # Variabel yang tidak tertulis di sini tidak akan sampai ke container
  # walaupun ada di .env. Pola ${VAR:-bawaan} = pakai .env, kalau kosong pakai bawaan.
  # Bawaan di bawah sengaja SAMA dengan bawaan di kode (app.py/chat.py/...),
  # supaya perilaku tidak berubah bila .env tidak dibuat.

  app:
    build: .
    container_name: bps-rag-app
    ports:
      # Bawaan: terbuka di semua antarmuka (seperti sebelumnya). Di server, bila
      # Hub berjalan di mesin yang SAMA, batasi ke lokal lewat .env:
      #   RAG_PORT_BIND=127.0.0.1:5000:5000
      # Layanan ini hanya boleh dipanggil dari server Hub (bukan dari browser).
      - "${RAG_PORT_BIND:-5000:5000}"
    environment:
      # ---- Layanan luar ----
      # host.docker.internal -- BUKAN nama service "qdrant"/"ollama", karena
      # container qdrant/ollama itu TIDAK didefinisikan/dikelola compose ini
      # (lihat catatan besar di atas). Di server, ganti lewat .env bila alamatnya beda.
      QDRANT_HOST: ${QDRANT_HOST:-host.docker.internal}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # ---- Model tanya-jawab (aman diubah kapan saja) ----
      # Bawaan di kode: qwen2.5:3b-instruct / qwen2.5:1.5b-instruct, tapi di
      # laptop ini hanya hermes3:latest yang ter-pull (qwen2.5 belum ada / 404),
      # jadi di-override ke hermes3:latest. Fallback disamakan ke hermes3:latest
      # karena tidak ada model kedua yang lebih kecil tersedia.
      LLM_MODEL: ${LLM_MODEL:-hermes3:latest}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-hermes3:latest}
      LLM_HEALTHCHECK_TIMEOUT: ${LLM_HEALTHCHECK_TIMEOUT:-60}
      # Jangan CONTEXT_WINDOW < 4096. Naikkan hanya bersama OLLAMA_CONTEXT_LENGTH.
      TOP_K_FINAL: ${TOP_K_FINAL:-6}
      CONTEXT_WINDOW: ${CONTEXT_WINDOW:-4096}

      # ---- Re-ranker ----
      # 'cpu' karena VRAM laptop sempit. Di server ber-GPU lega ganti ke 'cuda'
      # (image harus punya torch+CUDA).
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_DEVICE: ${RERANK_DEVICE:-cpu}

      # ---- Embedding: HARUS IDENTIK untuk tanya-jawab dan ingest ----
      # (chat.py, publikasi.py, sop.py membaca env yang sama.)
      # Mengganti = seluruh korpus harus di-embed ulang.
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}

      # ---- Antrean pertanyaan (app.py / ask_gate.py) ----
      # Naikkan ASK_MAX_CONCURRENT HANYA bersama OLLAMA_NUM_PARALLEL (sisi Ollama),
      # bertahap. JANGAN > 1 sebelum _LAST_RETRIEVAL_TIMING dibuat per-request.
      ASK_MAX_CONCURRENT: ${ASK_MAX_CONCURRENT:-1}
      ASK_MAX_WAITING: ${ASK_MAX_WAITING:-10}
      ASK_WAIT_TIMEOUT: ${ASK_WAIT_TIMEOUT:-90}

      # ---- Autentikasi & ingest dokumen (lihat KONTRAK_API_RAG.md) ----
      # RAG_API_KEY WAJIB diisi (di .env, jangan di-commit) agar endpoint
      # upload/hapus aktif. Kosong = endpoint ingest ditolak (503).
      RAG_API_KEY: ${RAG_API_KEY:-}
      # Hanya uji lokal. JANGAN 1 di server.
      INGEST_ALLOW_NO_AUTH: ${INGEST_ALLOW_NO_AUTH:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Kosong = folder ingest_data di samping app.py (ikut ter-bind-mount ke host).
      INGEST_DATA_DIR: ${INGEST_DATA_DIR:-}
      # Jumlah job ingest serentak. Di laptop ini biarkan 1 (RAM 15,5 GB,
      # VRAM ~3,3 GB bebas). Naikkan setelah spesifikasi server diketahui.
      INGEST_WORKERS: ${INGEST_WORKERS:-1}
      # [CEK] Nama ini TIDAK dibaca oleh app.py/chat.py/publikasi.py/sop.py/common.py;
      # yang dibaca kode ekstraksi adalah EXTRACT_WORKERS (di bawah). Dipertahankan
      # karena mungkin dibaca ingest_service.py / upload_runner.py (belum dilihat).
      INGEST_EXTRACT_WORKERS: ${INGEST_EXTRACT_WORKERS:-1}
      INGEST_JOB_TIMEOUT: ${INGEST_JOB_TIMEOUT:-3600}
      # 1 = dokumen unggahan menunggu persetujuan admin sebelum di-ingest.
      INGEST_REQUIRE_APPROVAL: ${INGEST_REQUIRE_APPROVAL:-0}
      # Model LLM saat INGEST (terpisah dari LLM_MODEL); harus ter-pull di Ollama.
      INGEST_LLM_MODEL: ${INGEST_LLM_MODEL:-hermes3}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-100}
      EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-3}
      # Kosong = bawaan kode (4). Sengaja dikosongkan agar perilaku ingest tidak berubah.
      EXTRACT_WORKERS: ${EXTRACT_WORKERS:-}
      # OCR untuk PDF scan (common.py)
      OCR_ENABLED: ${OCR_ENABLED:-1}
      OCR_LANG: ${OCR_LANG:-ind+eng}
      OCR_DPI: ${OCR_DPI:-200}
    volumes:
      # Bind mount seluruh project ke /app (menimpa hasil COPY . . di
      # Dockerfile saat container jalan) -- supaya perubahan kode
      # (termasuk ingest/*.py yang sering diedit iteratif) LANGSUNG
      # kepakai di container tanpa perlu `docker compose build` ulang.
      # Rebuild TETAP perlu kalau yang berubah Dockerfile/requirements.txt.
      # Akibatnya, data berikut tersimpan DI FOLDER PROJECT di host (bukan di
      # dalam container) dan ikut terbawa/ter-backup bersama folder ini:
      #   static/sop_images/, ingest_data/ (bila INGEST_DATA_DIR kosong), .env
      - .:/app
    restart: unless-stopped
    extra_hosts:
      # Wajib di Linux (host.docker.internal tidak otomatis ada seperti di
      # Docker Desktop Win/Mac). Kalau server ini Windows/Mac Docker Desktop,
      # baris ini tidak masalah (diabaikan, host.docker.internal sudah otomatis
      # tersedia). Kalau server-nya Linux, baris ini WAJIB supaya nama itu
      # bisa di-resolve ke IP gateway host.
      - "host.docker.internal:host-gateway"
